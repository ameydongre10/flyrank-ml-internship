<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#F8F9FA"/>
  
  <!-- Icon 1: Telemetry Warehouse -->
  <g transform="translate(60, 40)">
    <rect width="100" height="100" rx="12" fill="#2B2F38" fill-opacity="0.04" stroke="#2B2F38" stroke-width="1.5"/>
    <ellipse cx="50" cy="36" rx="28" ry="10" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <path d="M22 36 v16 c0 5.5 12.5 10 28 10 s28 -4.5 28 -10 v-16" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <path d="M22 52 v16 c0 5.5 12.5 10 28 10 s28 -4.5 28 -10 v-16" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <circle cx="50" cy="36" r="3" fill="#0D52D6"/>
    <text x="50" y="126" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#111215" text-anchor="middle">1. DuckDB Ingest</text>
  </g>

  <!-- Icon 2: Decision Tree Split -->
  <g transform="translate(240, 40)">
    <rect width="100" height="100" rx="12" fill="#2B2F38" fill-opacity="0.04" stroke="#2B2F38" stroke-width="1.5"/>
    <circle cx="50" cy="30" r="8" fill="none" stroke="#0D52D6" stroke-width="2"/>
    <path d="M50 38 L30 65 M50 38 L70 65" stroke="#2B2F38" stroke-width="2"/>
    <circle cx="30" cy="72" r="7" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <circle cx="70" cy="72" r="7" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <circle cx="50" cy="30" r="3" fill="#0D52D6"/>
    <text x="50" y="126" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#111215" text-anchor="middle">2. Decision Tree</text>
  </g>

  <!-- Icon 3: Ranking Prioritization -->
  <g transform="translate(420, 40)">
    <rect width="100" height="100" rx="12" fill="#2B2F38" fill-opacity="0.04" stroke="#2B2F38" stroke-width="1.5"/>
    <rect x="26" y="28" width="48" height="8" rx="2" fill="#0D52D6"/>
    <rect x="26" y="44" width="36" height="8" rx="2" fill="#2B2F38" fill-opacity="0.7"/>
    <rect x="26" y="60" width="24" height="8" rx="2" fill="#2B2F38" fill-opacity="0.4"/>
    <polyline points="66 54 74 62 82 54" fill="none" stroke="#0D52D6" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="126" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#111215" text-anchor="middle">3. Priority Queue</text>
  </g>

  <!-- Icon 4: Leakage Guardrail -->
  <g transform="translate(600, 40)">
    <rect width="100" height="100" rx="12" fill="#2B2F38" fill-opacity="0.04" stroke="#2B2F38" stroke-width="1.5"/>
    <path d="M50 24 L74 36 V54 C74 68 64 78 50 82 C36 78 26 68 26 54 V36 Z" fill="none" stroke="#2B2F38" stroke-width="2"/>
    <polyline points="40 52 47 59 62 44" fill="none" stroke="#0D52D6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="126" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#111215" text-anchor="middle">4. Zero Leakage</text>
  </g>
</svg>
